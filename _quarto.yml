project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "assignments/*.qmd"
    - "resources/*.qmd"
    - "notebooks/index.qmd"

website:
  title: "מבוא למדעי הרוח הדיגיטליים / שי גורדין"
  open-graph: true
  reader-mode: true
  navbar:
    logo: ariel_logo_navbar.png
    background: primary
    right:
      - text: "תכנית הקורס"
        href: about.qmd
      - text: "מחברות Python"
        href: notebooks/index.qmd
      - text: "מטלות"
        menu:
          - text: "מרכיבי הציון"
            href: assignments/index.qmd
          - text: "אבן דרך 1 — בחירת נושא וקריאה רחוקה"
            href: assignments/milestone1.qmd
          - text: "אבן דרך 2 — טיוטת ערך ויקיפדיה"
            href: assignments/milestone2.qmd
          - text: "אבן דרך 3 — פרסום ויקיפדיה ופוסטר"
            href: assignments/milestone3.qmd
      - text: "מקורות, כלים, ופרויקטים"
        menu:
          - text: "מקורות ובבליוגרפיה"
            href: resources/index.qmd
          - text: "כלים ופרויקטים"
            href: resources/tools-projects.qmd
  page-footer:
    background: light
    left: "© Shai Gordin, 2026"
    right: 
      - icon: github
        href: https://github.com/shaigordin
        aria-label: Shai Gordin GitHub
      - icon: twitter 
        href: https://twitter.com/shgordin
        aria-label: Shai Gordin Twitter
      - icon: envelope
        href: mailto:shygordin@gmail.com

format:
  html:
    include-in-header:
      - text: |
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&family=Alef:wght@400;700&display=swap" rel="stylesheet">
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: "בעמוד זה"
    lang: he
    dir: rtl



